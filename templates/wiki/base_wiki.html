<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link href="/static/css/main.css" rel="stylesheet" type="text/css">
    <link href="/static/css/wiki/mobile.css" rel="stylesheet" type="text/css">
      <link rel="icon" href="/static/img/main.ico">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
</head>
<body>
<header>
    <nav class="navbar navbar-dark bg-dark" style="color:white; background:black;">
        <div class="container-fluid">
         <a class="navbar-brand" href="/">Симулятор РБМК</a>
         <a class="navbar-brand" href="/wiki/errors">Аварии на РБМК</a>
         <a class="navbar-brand" href="/wiki">РБМК-wiki</a>
    <form class="d-flex" role="search" action="/wiki/search" method="post">
      <input id="search_text" name="search_text" class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
  </div>
    </nav>
</header>
<main role="main" class="main text-bg-light p-3">
    {% block content %}{% endblock %}
</main>
<nav class="navbar navbar-expand-lg bg-body-tertiary" style="position:relative; bottom:0px;">
    В случае ошибки, пожалуйста свяжитесь с нами через  <a href="/wiki/bad_info"> форму </a>
</nav>
</body>
</html>
