<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77776b"/>
      <stop offset=".25" stop-color="#45483f"/>
      <stop offset=".65" stop-color="#292d28"/>
      <stop offset="1" stop-color="#55564b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0d8c3"/>
      <stop offset=".3" stop-color="#77766a"/>
      <stop offset=".7" stop-color="#343830"/>
      <stop offset="1" stop-color="#b7ae98"/>
    </linearGradient>
    <linearGradient id="redPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a13b30"/>
      <stop offset=".5" stop-color="#70231e"/>
      <stop offset="1" stop-color="#421513"/>
    </linearGradient>
    <linearGradient id="redButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c3028"/>
      <stop offset=".5" stop-color="#571b18"/>
      <stop offset="1" stop-color="#32110f"/>
    </linearGradient>
    <radialGradient id="redLamp">
      <stop offset="0" stop-color="#ff8870"/>
      <stop offset=".5" stop-color="#e33124"/>
      <stop offset="1" stop-color="#6d100d"/>
    </radialGradient>
    <pattern id="scratches" width="90" height="70" patternUnits="userSpaceOnUse">
      <path d="M8 12l14-3 M42 31l11-2 M67 57l15-3 M15 61l9-2"
            stroke="#e1d8c2" stroke-width="1" opacity=".22"/>
      <path d="M30 45l12-2 M75 19l8 1"
            stroke="#090d0a" stroke-width="1.5" opacity=".35"/>
    </pattern>
    <pattern id="warning" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="17" height="34" fill="#a13b30"/>
      <rect x="17" width="17" height="34" fill="#252723"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="redGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="screw">
      <circle r="9" fill="#171a16" stroke="#c4baa3" stroke-width="2"/>
      <circle r="5" fill="#77766a" stroke="#292c26" stroke-width="1"/>
      <path d="M-3-3L3 3M3-3L-3 3" stroke="#272a24" stroke-width="1.8"/>
    </g>
    <g id="star">
      <path d="M0-19 L5-6 L19-6 L8 3 L12 17 L0 9 L-12 17 L-8 3 L-19-6 L-5-6 Z"
            fill="#e8b943" stroke="#ffe49a" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Тень -->
  <rect x="12" y="12" width="876" height="576" rx="12"
        fill="#000" opacity=".7" filter="url(#shadow)"/>

  <!-- Корпус -->
  <rect x="5" y="5" width="890" height="590" rx="10"
        fill="#101410" stroke="#171b16" stroke-width="5"/>
  <rect x="10" y="10" width="880" height="580" rx="8"
        fill="url(#frame)" stroke="#d0c7b0" stroke-width="1.5"/>
  <rect x="19" y="19" width="862" height="562" rx="5"
        fill="url(#metal)" stroke="#252a24" stroke-width="3"/>

  <!-- Внутренняя рамка -->
  <rect x="30" y="30" width="840" height="540" rx="3"
        fill="none" stroke="#aaa28e" stroke-width="1.5"/>
  <rect x="35" y="35" width="830" height="530" rx="3"
        fill="none" stroke="#20251f" stroke-width="1"/>

  <!-- Верхняя предупреждающая полоса -->
  <rect x="31" y="31" width="838" height="42"
        fill="url(#warning)" stroke="#191d18" stroke-width="2"/>

  <!-- Заголовок -->
  <rect x="225" y="20" width="450" height="75" rx="6"
        fill="#1a100e" stroke="#111410" stroke-width="3"/>
  <rect x="230" y="25" width="440" height="65" rx="4"
        fill="url(#redPlate)" stroke="#bba78b" stroke-width="1.5"/>
  <text x="450" y="69" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="35"
        font-weight="bold" letter-spacing="2"
        fill="#f0e5d3">ВЫ ПРОИГРАЛИ</text>

  <use href="#screw" x="244" y="37"/>
  <use href="#screw" x="656" y="37"/>
  <use href="#screw" x="244" y="78"/>
  <use href="#screw" x="656" y="78"/>

  <g transform="translate(230, -50)">
  <g transform="rotate(45)">
      <!-- Аварийный индикатор с красным крестом -->
<circle cx="165" cy="264" r="91"
        fill="#101410"
        stroke="#171a15"
        stroke-width="6"/>

<circle cx="165" cy="264" r="82"
        fill="#252923"
        stroke="#b7a991"
        stroke-width="3"/>

<circle cx="165" cy="264" r="72"
        fill="#171b17"
        stroke="#6f2922"
        stroke-width="2"/>

<!-- Основной красный крест -->
<path d="M165 211
         L184 211
         L184 245
         L218 245
         L218 283
         L184 283
         L184 317
         L146 317
         L146 283
         L112 283
         L112 245
         L146 245
         L146 211 Z"
      fill="#c51f18"
      stroke="#ff7661"
      stroke-width="3"
      stroke-linejoin="round"/>

<!-- Тёмная нижняя грань -->
<path d="M179 278
         L213 278
         L213 278
         L213 278
         L179 278
         L179 312
         L151 312
         L151 278
         L117 278
         L117 250
         L151 250
         L151 278 Z"
      fill="#8f1712"
      opacity=".5"/>
  </g>
    </g>
  <!-- Сообщение -->
  <text x="290" y="213"
        font-family="Arial, sans-serif" font-size="28"
        font-weight="bold" fill="#e9dfcc">
    Реактор вышел из-под контроля!
  </text>
  <text x="290" y="261"
        font-family="Arial, sans-serif" font-size="19"
        fill="#ded5c3">
    Вы не смогли предотвратить развитие аварии.
  </text>
  <text x="290" y="292"
        font-family="Arial, sans-serif" font-size="19"
        fill="#ded5c3">
    Работа энергоблока прекращена.
  </text>

  <!-- Разделитель -->
  <path d="M65 370H835" stroke="#a43a2e" stroke-width="2"/>
  <path d="M65 373H835" stroke="#e16b55" stroke-width=".7" opacity=".6"/>


   <!-- Кнопка -->
  <rect x="275" y="415" width="350" height="71" rx="5"
        fill="#101410" stroke="#090d09" stroke-width="3"/>
  <rect x="280" y="419" width="340" height="63" rx="3"
        fill="url(#redButton)" stroke="#b79b80" stroke-width="1.5"/>
  <rect x="287" y="425" width="326" height="51" rx="2"
        fill="none" stroke="#8b5548" stroke-width="1"/>

  <text x="450" y="458" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19"
        font-weight="bold" letter-spacing=".5"
        fill="#eee4d2">ПОПРОБОВАТЬ СНОВА</text>

  <!-- Винты -->
  <use href="#screw" x="43" y="43"/>
  <use href="#screw" x="857" y="43"/>
  <use href="#screw" x="43" y="557"/>
  <use href="#screw" x="857" y="557"/>

  <!-- Потёртости -->
  <g stroke="#ded4bd" stroke-width="1" opacity=".3">
    <path d="M23 140l12-3 M24 155l8-2 M858 155l10-2
             M850 320l14-3 M25 330l10-2 M835 550l18-3"/>
  </g>
</svg>